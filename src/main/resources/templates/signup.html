<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .signup-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="signup-container">
        <h2 class="text-center mb-4">회원가입</h2>

        <div id="errorMessage" class="alert alert-danger" style="display: none;">
            회원가입에 실패했습니다. 입력 정보를 확인하세요.
        </div>

        <form id="signupForm">
            <div class="mb-3">
                <label for="email" class="form-label">이메일</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="이메일을 입력하세요" required>
                <div id="emailError" class="text-danger" style="display: none;">* 이미 가입된 이메일입니다.</div>
            </div>
            <div class="mb-3">
                <label for="nickname" class="form-label">닉네임</label>
                <input type="text" class="form-control" id="nickname" name="nickname"
                       placeholder="닉네임을 입력하세요" required>
                <div id="nicknameError" class="text-danger" style="display: none;">* 이미 존재하는 닉네임입니다.</div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="비밀번호를 입력하세요" required>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">비밀번호 확인</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                       placeholder="비밀번호를 다시 입력하세요" required>
            </div>
            <button type="submit" class="btn-signup btn btn-primary w-100" id="signup">회원가입</button>
        </form>

        <div class="mt-3 text-center">
            <a href="/login">이미 계정이 있으신가요? 로그인</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

    function checkValue(type, value) {
        if(value.length === 0) return

        let errorId = type === 'email' ? '#emailError' : '#nicknameError'

        let data = {[type] : value}

        axios.get(`api/v1/users/check-${type}`, {
            params: {[type]: value},
            headers: {'content-Type': 'application/json'}
        }).then(res => {
            if (res.data.exists) {
                document.querySelector(errorId).style.display = 'block';
                document.querySelector("#signup").disabled = true;
            } else {
                document.querySelector(errorId).style.display = 'none';
                document.querySelector("#signup").disabled = false;
            }
        })
    }

    document.querySelector("#email").addEventListener("blur", function () {
        let email = document.querySelector("#email").value

        checkValue('email', email)
    })

    document.querySelector("#nickname").addEventListener("blur", function () {
        let nickname = document.querySelector("#nickname").value

        checkValue('nickname', nickname)
    })


    document.querySelector("#signupForm").addEventListener("submit", function (e) {
        e.preventDefault();

        let password = document.querySelector("#password").value
        let confirmPassword = document.querySelector("#confirmPassword").value

        if (password !== confirmPassword) {
            alert("비밀번호가 일치하지 않습니다.")
        }

        // 폼 데이터 수집
        let data = {
            email: document.querySelector("#email").value,
            password: password,
            nickname: document.querySelector("#nickname").value
        };

        axios.post('api/v1/users/new', data, {
            headers: {'Content-Type': 'application/json'}
        })
            .then(res => {
                console.log(res)
                window.location.href = "/login";
            })
            .catch(error => {
                console.error("회원가입 실패", error);
            })
    });
</script>

</body>
</html>
