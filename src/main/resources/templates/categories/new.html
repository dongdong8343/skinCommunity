<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카테고리 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">카테고리 및 서브카테고리 등록</h2>
    <form id="categoryForm">
        <div class="mb-3">
            <label for="categoryName" class="form-label">카테고리 이름</label>
            <input type="text" class="form-control" id="categoryName" placeholder="예: 계절별 피부관리 팁">
        </div>
        <div class="mb-3">
            <label for="categoryCode" class="form-label">카테고리 코드</label>
            <input type="text" class="form-control" id="categoryCode" placeholder="예: WT1">
        </div>

        <div class="mb-3">
            <label for="subCategoryName" class="form-label">서브카테고리 이름</label>
            <input type="text" class="form-control" id="subCategoryName" placeholder="예: 겨울">
        </div>
        <div class="mb-3">
            <label for="subCategoryCode" class="form-label">서브카테고리 코드</label>
            <input type="text" class="form-control" id="subCategoryCode" placeholder="예: WT1-1">
        </div>

        <button type="button" class="btn btn-primary" onclick="submitCategory()">등록하기</button>
    </form>

    <div class="mt-4" id="responseArea"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    function submitCategory() {
        const data = {
            categoryName: document.getElementById('categoryName').value,
            categoryCode: document.getElementById('categoryCode').value,
            subCategoryName: document.getElementById('subCategoryName').value,
            subCategoryCode: document.getElementById('subCategoryCode').value
        };

        axios.post('/api/v1/categories', data, {
            headers: {
                'Content-Type': 'application/json'
            }
        })
            .then(res => {
                document.getElementById('responseArea').innerHTML = `
                <div class="alert alert-success">등록 성공: ${JSON.stringify(res.data)}</div>
            `;
            })
            .catch(error => {
                document.getElementById('responseArea').innerHTML = `
                <div class="alert alert-danger">오류 발생: ${error.response ? error.response.data : error.message}</div>
            `;
            });
    }
</script>
</body>
</html>
